# docker-compose.prod.yml
# Production-grade orchestration for self-hosted deployment (VPS, DigitalOcean, etc.)
# For Render/Railway/Vercel cloud deployment, see docs/deployment.md
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Copy .env.prod.example to .env.prod and fill in all values
#   - Point your domain DNS to this server
#   - Run: docker-compose -f docker-compose.prod.yml run --rm certbot certonly

version: "3.9"

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cineai_postgres_prod
    <<: *restart-policy
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cineai}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cineai_net]
    # Do NOT expose port 5432 in production — internal network only

  # ── Qdrant ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: cineai_qdrant_prod
    <<: *restart-policy
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant-config.yaml:/qdrant/config/production.yaml:ro
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks: [cineai_net]
    # Internal only — do not expose 6333 publicly

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cineai_redis_prod
    <<: *restart-policy
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 100
      --appendonly yes
    volumes:
      - redis_data:/data
    networks: [cineai_net]

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: runtime
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: cineai-backend:latest
    container_name: cineai_backend_prod
    <<: *restart-policy
    environment:
      ENVIRONMENT:    production
      DEBUG:          "false"
      DATABASE_URL:   postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379
      QDRANT_HOST:    qdrant
      QDRANT_PORT:    "6333"
      SECRET_KEY:     ${SECRET_KEY}
      TMDB_API_KEY:   ${TMDB_API_KEY}
      CORS_ORIGINS:   ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [cineai_net]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: cineai-frontend:latest
    container_name: cineai_frontend_prod
    <<: *restart-policy
    environment:
      NODE_ENV: production
    networks: [cineai_net]
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: cineai_nginx
    <<: *restart-policy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks: [cineai_net]

  # ── Certbot (SSL) ──────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: cineai_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run manually: docker-compose run --rm certbot certonly --webroot ...
    profiles: ["ssl"]

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  certbot_www:
  certbot_certs:

networks:
  cineai_net:
    driver: bridge
